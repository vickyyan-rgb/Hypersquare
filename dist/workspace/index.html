<!doctype html>
<html lang="en" class="workspace-document">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HyperSquare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&family=Atkinson+Hyperlegible+Mono:wght@200..800&display=swap">
<style>
/* Layout: app shell — role-aware sidebar, top bar, routed workspace; overlays for drawer, palette, toasts. */
:root{
  --bg:#edeef0; --surface:#FFFFFF; --surface2:#f7f7f9; --sidebar:#f5f5f7; --line:#e3e4e6; --line2:#eeeff0;
  --ink:#101113; --ink2:#44464a; --ink3:#606267;
  --accent:#515a81; --accent-hover:#444b6d; --accent-ink:#444b6d; --accent-tint:#f0f1f5; --on-accent:#FFFFFF;
  --ok:#547460; --ok-tint:#f0f4f2; --warn:#6f6146; --warn-tint:#f5f3ec; --risk:#774c48; --risk-tint:#f4efee;
  --code:#101113; --shadow:0 1px 2px rgba(16,17,19,.05),0 8px 24px rgba(16,17,19,.08); --overlay:rgba(16,17,19,.28);
  --sans:'Atkinson Hyperlegible Next',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Atkinson Hyperlegible Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0e0f; --surface:#161719; --surface2:#1c1d1f; --sidebar:#121315; --line:#2a2b2e; --line2:#232426;
  --ink:#e9eaec; --ink2:#bcbec1; --ink3:#9a9ca0;
  --accent:#868fb1; --accent-hover:#9ea6c1; --accent-ink:#b6bbd0; --accent-tint:#21232c; --on-accent:#0d0e12;
  --ok:#9ec1ac; --ok-tint:#1f2622; --warn:#cabd9c; --warn-tint:#28261f; --risk:#be9f9d; --risk-tint:#261e1e;
  --code:#0a0b0c; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.45); --overlay:rgba(0,0,0,.55); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d0e0f; --surface:#161719; --surface2:#1c1d1f; --sidebar:#121315; --line:#2a2b2e; --line2:#232426;
  --ink:#e9eaec; --ink2:#bcbec1; --ink3:#9a9ca0;
  --accent:#868fb1; --accent-hover:#9ea6c1; --accent-ink:#b6bbd0; --accent-tint:#21232c; --on-accent:#0d0e12;
  --ok:#9ec1ac; --ok-tint:#1f2622; --warn:#cabd9c; --warn-tint:#28261f; --risk:#be9f9d; --risk-tint:#261e1e;
  --code:#0a0b0c; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.45); --overlay:rgba(0,0,0,.55); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.mono{font-family:var(--mono)}
.label{font:600 11px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.muted{color:var(--ink3)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;font:500 13px/1 var(--sans);border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .12s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--accent);color:var(--on-accent)}.btn-primary:hover:not(:disabled){background:var(--accent-hover)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}.btn-secondary:hover:not(:disabled){border-color:var(--ink3)}
.btn-ghost{background:transparent;color:var(--ink2)}.btn-ghost:hover{background:var(--surface2);color:var(--ink)}
.btn-lg{height:44px;padding:0 18px;font-size:14px}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:4px;font:500 12px var(--sans);white-space:nowrap}
.t-ok{background:var(--ok-tint);color:var(--ok)}.t-warn{background:var(--warn-tint);color:var(--warn)}.t-risk{background:var(--risk-tint);color:var(--risk)}
.t-accent{background:var(--accent-tint);color:var(--accent-ink)}.t-plain{background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.field{height:38px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:400 14px var(--sans);outline:none;min-width:0}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
textarea.field{height:auto;min-height:96px;padding:10px 12px;line-height:1.5;resize:vertical;width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.side{background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-left:env(safe-area-inset-left,0px)}
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;font-weight:600;font-size:15px}
.roles{margin:4px 14px 12px;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:6px;padding:3px;position:relative;background:var(--surface)}
.roles .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--ink);border-radius:4px;transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.roles button{position:relative;z-index:1;background:none;border:0;padding:7px 4px;font:500 12px var(--sans);color:var(--ink2);cursor:pointer;border-radius:4px;transition:color .25s;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.roles button small{font-size:10.5px;opacity:.75;font-weight:400}
.roles button[aria-pressed="true"]{color:var(--bg)}
.nav{position:relative;display:flex;flex-direction:column;gap:2px;padding:4px 10px}
.nav .ind{position:absolute;left:10px;right:10px;border-radius:6px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 2px rgba(16,17,19,.05);transition:transform .38s cubic-bezier(.3,1.2,.4,1),height .3s;z-index:0;pointer-events:none}
.nav .ind::before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0;background:var(--accent)}
.navbtn{position:relative;z-index:1;display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border:0;background:none;border-radius:6px;color:var(--ink2);cursor:pointer;font:500 13.5px var(--sans);text-align:left;width:100%}
.navbtn:hover{color:var(--ink)}
.navbtn[aria-current="page"]{color:var(--ink)}
.navbtn .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:4px;background:var(--accent);color:var(--on-accent);font:600 11px/20px var(--mono);text-align:center}
.navbtn.pop .badge,.navbtn.pop{animation:navpop .7s cubic-bezier(.3,1.6,.5,1)}
.sidefoot{margin-top:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.partner{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:6px;text-decoration:none;color:var(--ink);transition:border-color .2s,background .2s}
.partner:hover{border-color:var(--accent);background:var(--surface)}
.me{display:flex;align-items:center;gap:10px}
.me.account-link{width:100%;padding:8px 6px;border:1px solid transparent;border-radius:7px;background:none;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.me.account-link:hover,.me.account-link[aria-current="page"]{background:var(--surface);border-color:var(--line)}
.account-shortcut{display:none;margin-left:auto}
.account-page{max-width:1160px!important}
.account-identity{display:flex;align-items:center;gap:16px;margin-bottom:24px}.account-identity .av{width:52px;height:52px;font-size:19px;border-radius:10px}.account-identity h2{font-size:20px}.account-identity p{font-size:13px;color:var(--ink3);margin-top:3px}.account-identity .tag{margin-left:auto}
.account-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.account-panel{padding:24px;display:flex;flex-direction:column;gap:18px;min-width:0}.account-panel h2{font-size:17px;font-weight:600}.account-panel>p{font-size:13px;color:var(--ink3)}
.account-field{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:500}.account-field .field{width:100%;height:42px;font-weight:400}.account-field small{font-size:12px;font-weight:400;color:var(--ink3)}
.account-details{display:flex;flex-direction:column;gap:14px;margin:0}.account-details>div{display:flex;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--line2)}.account-details>div:last-child{padding-bottom:0;border:0}.account-details dt{color:var(--ink3);font-size:13px}.account-details dd{margin:0;font-size:13px;text-align:right}
.account-offer{border:1px solid var(--line);border-radius:7px;padding:18px;background:var(--surface2);display:flex;flex-direction:column;gap:6px}.account-offer>strong{font-size:25px;font-weight:600;line-height:1.3}.account-offer>span{font-size:14px;font-weight:500}.account-offer p{font-size:12px;color:var(--ink3)}
.account-offer-empty{padding:20px;border:1px dashed var(--line);border-radius:7px;color:var(--ink3);font-size:13px}
.account-preference{display:flex;align-items:flex-start;gap:11px;cursor:pointer}.account-preference input{width:16px;height:16px;margin-top:3px;accent-color:var(--accent)}.account-preference>span{display:flex;flex-direction:column;gap:3px;font-size:13px}.account-preference small{font-size:12px;color:var(--ink3);font-weight:400}
.account-actions{display:flex;align-items:center;gap:10px;margin-top:22px}.account-actions>span{margin-left:auto;color:var(--ink3);font-size:12px}.account-error{margin-top:18px;font-size:13px;color:var(--risk)}
@media(max-width:860px){.account-shortcut{display:grid}.account-grid{grid-template-columns:minmax(0,1fr)}.account-panel{padding:20px}.account-actions{flex-wrap:wrap}.account-actions>span{flex-basis:100%;margin:4px 0 0}}
.av{width:30px;height:30px;border-radius:6px;background:var(--accent-tint);color:var(--accent-ink);display:grid;place-items:center;font:600 12px var(--sans);flex-shrink:0}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-shrink:0;padding-right:max(20px,env(safe-area-inset-right,0px))}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3);min-width:0}
.crumb strong{color:var(--ink);font-weight:600;font-size:15px;white-space:nowrap}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;height:34px;width:min(320px,34vw);padding:0 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface2);color:var(--ink3);cursor:pointer;font:13px var(--sans)}
.search kbd{margin-left:auto;font:11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--surface)}
.iconbtn{position:relative;width:34px;height:34px;display:grid;place-items:center;border-radius:6px;border:1px solid transparent;background:none;color:var(--ink2);cursor:pointer}
.iconbtn:hover{background:var(--surface2);color:var(--ink)}
.dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:2px;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.content{flex:1;overflow:auto;min-height:0;view-transition-name:content}
.page{padding:28px clamp(20px,3vw,48px) 56px;max-width:1600px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.01em}
.page-head p{color:var(--ink2);margin-top:4px;max-width:70ch}
.page.home-landing{max-width:1600px;min-height:100%;gap:42px;padding-top:clamp(36px,6vh,76px);padding-bottom:48px}
.home-welcome{display:flex;flex-direction:column;gap:14px;max-width:760px}.home-welcome h1{font-size:clamp(32px,3.2vw,48px);line-height:1.15;font-weight:600;letter-spacing:-.025em}.home-welcome p{font-size:17px;line-height:1.6;color:var(--ink3)}
.home-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:stretch}
.home-action{display:flex;flex-direction:column;align-items:flex-start;min-width:0;min-height:390px;padding:clamp(24px,2.4vw,36px);border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.home-action-symbol{width:62px;height:62px;display:grid;place-items:center;border-radius:16px;background:var(--accent-tint);color:var(--accent-ink);margin-bottom:32px}.home-action-symbol .ic{width:28px;height:28px}.home-action.code-action .home-action-symbol{background:var(--ink);color:var(--surface)}
.home-action h2{font-size:26px;line-height:1.2;font-weight:600;letter-spacing:-.02em;margin-bottom:14px}.home-action>p{font-size:15px;color:var(--ink2);line-height:1.7;margin-bottom:28px;max-width:34ch}
.home-action-meta{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink3);margin-top:auto;margin-bottom:18px;min-height:22px}.home-action .home-action-cta{width:100%;justify-content:space-between;min-height:46px;padding:0 16px;font-weight:600}
@media(max-width:1150px){.home-actions{gap:14px}.home-action{padding:24px;min-height:380px}.home-action h2{font-size:23px}}
@media(max-width:1000px){.home-actions{grid-template-columns:minmax(0,1fr)}.home-action{min-height:0}.home-action-symbol{width:48px;height:48px;margin-bottom:22px}.home-action>p{max-width:none;margin-bottom:22px}.home-action .home-action-cta{max-width:360px}.page.home-landing{gap:28px;padding-top:30px}}
.enter>*{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(5){animation-delay:.16s}.enter>*:nth-child(6){animation-delay:.2s}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.sec{display:flex;flex-direction:column}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.sec-h h2{font-size:14px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line2);transition:background .15s}
.row:last-child{border-bottom:0}
.row.click{cursor:pointer}
button.row{width:100%;border:0;border-bottom:1px solid var(--line2);background:none;text-align:left;font:inherit;color:inherit}
.row.click:hover{background:var(--surface2)}
.stat{padding:16px 18px;border-right:1px solid var(--line2);display:flex;flex-direction:column;gap:4px}
.stat:last-child{border-right:0}
.stat b{font:600 26px/1.1 var(--sans);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:22px 24px;position:relative;overflow:hidden}
.hero .meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink2);font-size:13px}
.empty{padding:28px 18px;text-align:center;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:8px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer;transition:background .15s}
.tbl tbody tr:hover{background:var(--surface2)}
.tbl tbody tr.fresh{animation:fresh 2.4s ease-out}
.tblwrap{overflow-x:auto}
.bar{height:6px;border-radius:1px;background:var(--line2);overflow:hidden;min-width:80px}
.bar span{display:block;height:100%;background:var(--accent);transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.bar span.low{background:var(--risk)}.bar span.mid{background:var(--warn)}

/* interview */
.iv{display:grid;grid-template-columns:260px minmax(0,1fr) minmax(0,460px);gap:16px;align-items:stretch}
.outline li{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:11px 16px;border-top:1px solid var(--line2);position:relative;transition:background .25s}
.outline li.cur{background:var(--accent-tint)}
.outline li.cur::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.qst{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink3)}
.qst.now{color:var(--accent-ink);font-weight:500}.qst.done{color:var(--ok);font-weight:500}.qst.unsure{color:var(--warn);font-weight:500}
.segs{display:flex;gap:3px}.segs i{flex:1;height:4px;border-radius:1px;background:var(--line);transition:background .3s}
.segs i.done{background:var(--ok)}.segs i.cur{background:var(--accent)}.segs i.unsure{background:var(--warn)}.segs i.skip{background:repeating-linear-gradient(90deg,var(--ink3) 0 4px,transparent 4px 7px)}
.mic{height:52px;min-width:260px;border-radius:6px;background:var(--ink);color:var(--bg);border:0;font:500 15px var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;padding:0 24px;position:relative;user-select:none;-webkit-user-select:none;touch-action:none;transition:background .2s}
.mic.rec{background:var(--accent);color:var(--on-accent)}
.mic.rec::after{content:"";position:absolute;inset:-5px;border-radius:9px;border:2px solid var(--accent);opacity:.5;animation:ring 1.3s ease-out infinite}
.bars{display:inline-flex;align-items:center;gap:3px;height:22px}
.bars i{display:block;width:3px;border-radius:1px;background:currentColor;height:6px;animation:bar .9s ease-in-out infinite}
.bars i:nth-child(2n){animation-duration:.7s;animation-delay:-.2s}.bars i:nth-child(3n){animation-duration:1.1s;animation-delay:-.5s}.bars i:nth-child(5n){animation-duration:.8s;animation-delay:-.35s}
.segbar{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.segbar button{background:none;border:0;border-right:1px solid var(--line2);padding:0 14px;min-height:38px;font:500 13px var(--sans);color:var(--ink2);display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.segbar button:last-child{border-right:0}
.segbar button:hover{background:var(--surface2);color:var(--ink)}
.caret{display:inline-block;width:2px;height:1em;background:var(--accent);margin-left:3px;vertical-align:-.12em;animation:blink .7s steps(1) infinite}
.rtable{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rrow{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line2);animation:up .35s cubic-bezier(.2,.8,.2,1) both}
.rrow:first-child{border-top:0}
.rrow:nth-child(2){animation-delay:.07s}.rrow:nth-child(3){animation-delay:.14s}.rrow:nth-child(4){animation-delay:.21s}
.dots{display:inline-flex;gap:5px}.dots i{display:block;width:6px;height:6px;border-radius:1px;background:var(--accent);animation:dotb 1s ease-in-out infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}

/* interview stage (layout follows the original prototype; visual is HyperSquare) */
.iv2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 1fr;gap:24px;align-items:stretch;min-height:calc(100dvh - 156px)}
.stage{position:relative;border-radius:14px;overflow:hidden;min-height:560px;background:radial-gradient(ellipse at 70% 15%,#373b4c 0%,#1b1d24 45%,#0c0d10 100%);color:#e9eaec;isolation:isolate}
.racks{position:absolute;inset:0;display:flex;gap:16px;padding:34px 110px 0;filter:blur(5px);opacity:.6;z-index:-1}
.racks i{flex:1;border-radius:3px;background-color:#24262e;background-image:radial-gradient(circle,#949cbb 1.3px,transparent 1.8px);background-size:12px 22px;background-position:6px 10px;animation:racks 2.6s steps(2) infinite}

.orbwrap.talk .ring{animation:oring 1.4s ease-out infinite}.orbwrap.talk .r2{animation-delay:.7s}

@keyframes racks{50%{background-position:6px 21px}}

/* review */
.kcard{padding:18px 20px;display:flex;flex-direction:column;gap:12px;transition:border-color .3s,box-shadow .3s,opacity .3s}
.kcard.ready{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.kcard.flag{opacity:.6}
.kcard.just{animation:okflash .8s ease-out}
.srcbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:4px;border:1px solid var(--line);background:var(--surface2);font:500 12px var(--sans);color:var(--ink2);cursor:pointer}
.srcbtn[aria-expanded="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.srcbtn .mono{font-size:11.5px}
.drawerin{animation:up .3s cubic-bezier(.2,.8,.2,1) both}
.chg{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px;color:var(--accent-ink)}
.sticky{position:sticky;bottom:0;z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 28px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}

/* tickets */
.tk{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:16px;align-items:start}
.tkitem{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-bottom:1px solid var(--line2);cursor:pointer;position:relative;transition:background .15s;text-align:left;border-left:0;border-right:0;border-top:0;background:none;width:100%}
.tkitem:hover{background:var(--surface2)}
.tkitem[aria-current="true"]{background:var(--accent-tint)}
.tkitem[aria-current="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.qa{border-top:1px solid var(--line2);padding:16px 20px;display:flex;flex-direction:column;gap:8px;animation:up .35s cubic-bezier(.2,.8,.2,1) both}
.skel{height:10px;border-radius:2px;background:linear-gradient(90deg,var(--line2) 0%,var(--surface2) 50%,var(--line2) 100%);background-size:200% 100%;animation:sh 1.1s linear infinite}
.sug{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:4px;border:1px solid var(--line);background:var(--surface);font:500 12.5px var(--sans);color:var(--ink2);cursor:pointer;transition:border-color .15s,color .15s}
.sug:hover{border-color:var(--accent);color:var(--accent-ink)}
.newtag{animation:fadein .4s both}

/* overlays */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:40;animation:fadein .2s both}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slidein .38s cubic-bezier(.2,.9,.2,1) both;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.drawer-b{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:18px}
.dl{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13px}
.dl dt{color:var(--ink3)}.dl dd{margin:0}
.palette{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(620px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:60;overflow:hidden;animation:popin .22s cubic-bezier(.2,.9,.3,1.2) both}
.palette input{width:100%;height:52px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:0 18px;font:400 16px var(--sans);outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:min(420px,60vh);overflow:auto}
.palette li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;cursor:pointer;color:var(--ink2)}
.palette li[aria-selected="true"]{background:var(--accent-tint);color:var(--ink)}
.palette .grp{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:10px 12px 4px}
.menu{position:absolute;right:0;top:calc(100% + 6px);width:340px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:30;overflow:hidden;animation:popin .18s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:top right}
.toasts{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:70;width:min(380px,calc(100vw - 32px))}
.toast{position:relative;overflow:hidden;background:var(--ink);color:var(--bg);border-radius:6px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow);animation:toastin .35s cubic-bezier(.2,.9,.3,1.2) both;font-size:13.5px}
.toast .tbar{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);animation:shrink 4.2s linear both}
.fly{position:fixed;z-index:80;pointer-events:none;border-radius:6px;background:var(--surface);border:1px solid var(--accent);box-shadow:var(--shadow);padding:10px 12px;font:500 13px var(--sans);color:var(--ink);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* robot */
.botbox{position:relative;flex-shrink:0}
.bot{position:relative;width:96px;height:104px;transform-origin:0 0}
.bot-body{position:absolute;inset:0;animation:float 3.6s ease-in-out infinite;transform-origin:50% 80%}
.bot-ant{position:absolute;left:46px;top:4px;width:4px;height:16px;background:#2f3136;border-radius:1px}
.bot-ant i{position:absolute;left:-3px;top:-8px;width:10px;height:10px;border-radius:2px;background:#868fb1;box-shadow:0 0 0 4px rgba(134,143,177,.18)}
.bot-head{position:absolute;left:6px;top:16px;width:84px;height:70px;border-radius:16px;background:#18191c;box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 10px 22px rgba(16,17,19,.16)}
.bot-ear{position:absolute;top:38px;width:8px;height:24px;border-radius:3px;background:#2f3136;transition:background .3s,box-shadow .3s}
.bot-ear.l{left:1px}.bot-ear.r{right:1px}
.bot-face{position:absolute;left:10px;right:10px;top:10px;bottom:12px;border-radius:10px;background:#0b0c0e;border:1px solid rgba(134,143,177,.3);overflow:hidden}
.bot-eyes{position:absolute;left:0;right:0;top:10px;height:18px;display:flex;justify-content:center;align-items:center;gap:16px}
.eye{display:block;width:10px;height:14px;border-radius:3px;background:#b6bbd0;box-shadow:0 0 10px rgba(120,130,168,.8);animation:blink2 4.6s infinite;transition:height .25s}
.bot-mouth{position:absolute;left:0;right:0;bottom:6px;height:12px;display:flex;justify-content:center;align-items:center;gap:3px}
.bot-mouth i{display:block;width:3px;height:3px;border-radius:1px;background:#868fb1}
.bot-shadow{position:absolute;left:24px;bottom:0;width:48px;height:5px;border-radius:50%;background:rgba(16,17,19,.16);animation:shadowp 3.6s ease-in-out infinite}
.bot.talk .bot-mouth i{animation:talk .5s ease-in-out infinite}
.bot.talk .bot-mouth i:nth-child(2){animation-delay:-.15s}.bot.talk .bot-mouth i:nth-child(3){animation-delay:-.3s}.bot.talk .bot-mouth i:nth-child(4){animation-delay:-.1s}.bot.talk .bot-mouth i:nth-child(5){animation-delay:-.22s}
.bot.talk .bot-ant i{animation:antp 1s ease-in-out infinite}
.bot.listen .bot-body{animation:tilt 2.4s ease-in-out infinite}
.bot.listen .bot-ear{background:#7882a8;box-shadow:0 0 12px rgba(120,130,168,.65)}
.bot.listen .eye{height:17px}
.bot.think .bot-eyes{animation:scan 1.4s ease-in-out infinite}
.bot.think .eye{height:6px}
.bot.think .bot-ant i{animation:antblink .8s steps(1) infinite}
.bot.glance .bot-eyes{animation:glance 7s ease-in-out infinite}
.bot.shrug .bot-body{animation:shrug 1.2s ease-in-out 1,float 3.6s ease-in-out 1.2s infinite}
.bot.shrug .eye{height:5px}
.bot.happy .eye{width:14px;height:8px;background:transparent;border:3px solid #b6bbd0;border-bottom:0;border-radius:8px 8px 0 0;box-shadow:none;animation:none}
.bot.happy .bot-mouth i{display:none}
.bot.happy .bot-mouth::after{content:"";width:18px;height:7px;border:2.5px solid #868fb1;border-top:0;border-radius:0 0 10px 10px}
.bot.happy .bot-body{animation:hop .9s cubic-bezier(.3,1.6,.5,1) 2,float 3.6s ease-in-out 1.8s infinite}
.tip{position:absolute;left:0;top:calc(100% + 8px);z-index:6;width:260px;background:var(--ink);color:var(--bg);font-size:13px;line-height:18px;padding:10px 12px;border-radius:6px;animation:up .25s both}

/* view transitions */
::view-transition-old(content){animation:vtout .16s ease-in both}
::view-transition-new(content){animation:vtin .34s cubic-bezier(.2,.8,.2,1) both}
::view-transition-old(root),::view-transition-new(root){animation:none}

@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes vtout{to{opacity:0;transform:translateY(-4px)}}
@keyframes vtin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes popin{from{opacity:0;transform:translateX(var(--tx,0)) scale(.96)}to{opacity:1;transform:translateX(var(--tx,0)) scale(1)}}
@keyframes toastin{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes shrink{from{width:100%}to{width:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fresh{0%,30%{background:var(--accent-tint)}100%{background:transparent}}
@keyframes okflash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 0%,transparent)}35%{box-shadow:0 0 0 5px color-mix(in srgb,var(--ok) 30%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes navpop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes ring{from{opacity:.55;transform:scale(1)}to{opacity:0;transform:scale(1.08)}}
@keyframes bar{0%,100%{height:5px}50%{height:20px}}
@keyframes blink{50%{opacity:0}}
@keyframes dotb{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes shadowp{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.82);opacity:.6}}
@keyframes blink2{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes talk{0%,100%{height:3px}50%{height:10px}}
@keyframes antp{0%,100%{box-shadow:0 0 0 3px rgba(134,143,177,.3)}50%{box-shadow:0 0 0 9px rgba(134,143,177,0)}}
@keyframes tilt{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(-2deg) translateY(-3px)}}
@keyframes scan{0%,100%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
@keyframes antblink{50%{background:#b6bbd0;box-shadow:none}}
@keyframes glance{0%,55%,100%{transform:translateX(0)}62%,80%{transform:translateX(8px)}}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-12px) rotate(4deg)}}
@keyframes shrug{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}60%{transform:rotate(6deg)}}

  .grid2{grid-template-columns:minmax(0,1fr)}

}

function questionCodeSource(q, items){
  var ticket=TICKETS.find(function(t){return t.id===q.ticket;});
  var chosen=items.find(function(it){return it.id===q.codeItem && it.code;});
  if(!chosen){
    var words=(q.text || '').toLowerCase().match(/[a-z0-9-]{3,}/g) || [];
    var candidates=items.filter(function(it){return it.program===q.program && it.code && !it.originalCode;});
    function score(it){var text=(it.title+' '+it.body+' '+it.tags.join(' ')).toLowerCase();return words.reduce(function(n,w){return n+(text.indexOf(w)>=0?1:0);},0)+(ticket?it.tags.filter(function(tag){return ticket.tags.indexOf(tag)>=0;}).length:0);}
    candidates.sort(function(a,b){return score(b)-score(a);});chosen=candidates[0];
  }
  var rows=chosen?chosen.code:q.program==='CBACT04C'?SESSION_CODE:null;
  return {file:chosen?chosen.file:q.program+'.cbl',text:rows?rows.map(function(r){return r?r[1]:'      *> ... other lines omitted ...';}).join('\n'):'',sourceLines:chosen?chosen.lines:rows?'L415–520':'',available:!!rows};
}
function codeAnswerDiff(original, text){
  var before=original.split('\n'), after=text.split('\n'), n=before.length, m=after.length;
  var table=Array.from({length:n+1},function(){return new Uint32Array(m+1);});
  for(var i=n-1;i>=0;i--)for(var j=m-1;j>=0;j--)table[i][j]=before[i]===after[j]?1+table[i+1][j+1]:Math.max(table[i+1][j],table[i][j+1]);
  var lines=[],removed=0;i=0;j=0;
  while(i<n || j<m){
    if(i<n && j<m && before[i]===after[j]){lines.push({text:after[j++],changed:false});i++;}
    else if(i<n && (j===m || table[i+1][j]>=table[i][j+1])){removed++;i++;}
    else{lines.push({text:after[j++],changed:true});}
  }
  return {lines:lines,removed:removed,added:lines.filter(function(line){return line.changed;}).length};
}
function QuestionCodeAnswer(p){

        <textarea className="qca-input" aria-label="Code answer" autoFocus=${true} spellCheck=${false} autoComplete="off" autoCorrect="off" autoCapitalize="off" value=${code} onInput=${function(ev){setCode(ev.target.value);}} onKeyDown=${indent}></textarea>
      </div>
      <div className="qca-foot"><span role="status">${changed?diff.added+' added or edited · '+diff.removed+' replaced or removed':'Click into the code to edit or add your answer.'}</span><span>Tab indents · Shift + Tab moves focus</span></div>

  </section>`;
}

function Coverage(){
  var ctx = useStore(), s = ctx.s;
  var rows = PROGRAMS.map(function(p){
    var n = s.items.filter(function(i){ return i.status === 'verified' && i.program === p.id; }).length;
    var cov = Math.min(1, n / p.target), urg = p.retireMo <= 3 ? 1 : p.retireMo <= 6 ? .7 : .4, risk = (1 - cov) * urg;
    return Object.assign({}, p, {n:n, cov:cov, risk:risk, level:risk > .6 ? 'High' : risk > .35 ? 'Medium' : 'Low'});
  }).sort(function(a, b){ return b.risk - a.risk; });
  var total = rows.reduce(function(a, r){ return a + r.n; }, 0), target = rows.reduce(function(a, r){ return a + r.target; }, 0);
  var pct = useCount(Math.round(total / target * 100)), high = rows.filter(function(r){ return r.level === 'High'; }).length;
  var answered = new Set(s.questions.filter(function(q){ return q.status !== 'open'; }).map(function(q){ return q.ticket; }));
  var gaps = GAPS.filter(function(g){ var m = g.src.match(/INC-\d+/); return !(m && answered.has(m[0]) && g.src.indexOf('Engineer question') === 0); });
  var ad = useState({}), added = ad[0], setAdded = ad[1];
  var open = gaps.filter(function(g){ return !added[g.text]; }).length;
  var gapN = useCount(open);
  return html`<div className="page enter">
    <div className="page-head"><div><h1 style=${{display:'flex', alignItems:'center', gap:10, flexWrap:'wrap'}}>Knowledge coverage<span className="tag t-accent">Manager view</span></h1><p>What’s still unknown, before each expert retires.</p></div></div>
    <section className="panel"><div className="grid4">
      <div className="stat"><span className="label">Open gaps</span><b style=${{color:open ? 'var(--warn)' : 'var(--ok)'}}>${gapN}</b><span className="muted" style=${{fontSize:13}}>${gaps.length - open} added to interviews</span></div>
      <div className="stat"><span className="label">High-risk programs</span><b style=${{color:high ? 'var(--risk)' : 'inherit'}}>${high}</b><span className="muted" style=${{fontSize:13}}>low coverage, expert leaving soon</span></div>
      <div className="stat"><span className="label">Raj P. retires</span><b>Dec 2026</b><span className="muted" style=${{fontSize:13}}>3 CICS programs</span></div>
      <div className="stat"><span className="label">Overall coverage</span><b>${pct}%</b><span className="muted" style=${{fontSize:13}}>${total} of ${target} target items</span></div>
    </div></section>
    <section className="panel sec">
      <div className="sec-h"><h2>What we still don’t know</h2></div>
      ${gaps.map(function(g, k){ var isAdded = !!added[g.text]; return html`<div key=${k} className=${'row gap' + (isAdded ? ' added' : '')}>
        <span className="tag t-plain mono">${g.program}</span>
        <span style=${{flex:1, minWidth:0, display:'flex', flexDirection:'column', gap:2}}><span className="gap-t">${g.text}</span><span className="muted" style=${{fontSize:13}}>${g.src}${g.urgent ? ' · expert leaves soon' : ''}</span></span>
        ${isAdded ? html`<span className="tag t-ok addedtag"><${Icon} n="check" size=${12}/>In ${g.who.split(' ')[0]}’s next interview</span>`
          : html`<button className="btn btn-secondary" onClick=${function(){ var n = Object.assign({}, added); n[g.text] = true; setAdded(n); ctx.dispatch({type:'toast', text:'Added to ' + g.who + '’s next interview.'}); }}><${Icon} n="calendar"/>Ask ${g.who.split(' ')[0]}</button>`}</div>`; })}
    </section>
    <section className="panel tblwrap">
      <div className="sec-h"><h2>Coverage by program</h2></div>
      <table className="tbl">
        <thead><tr><th>Program</th><th>Expert</th><th style=${{width:'30%'}}>Captured</th><th style=${{textAlign:'right'}}>Items</th><th>Risk</th></tr></thead>
        <tbody>${rows.map(function(r, k){ return html`<tr key=${r.id} onClick=${function(){ ctx.dispatch({type:'patch', patch:{libFilter:{q:'', program:r.n ? r.id : 'all'}}}); ctx.go('library'); }} tabIndex="0">
          <td><div className="mono" style=${{fontWeight:500}}>${r.id}</div><div className="muted" style=${{fontSize:13}}>${r.name}</div></td>
          <td style=${{whiteSpace:'nowrap'}}>${r.owner}<div className="muted" style=${{fontSize:13}}>retires in ${r.retireMo} mo</div></td>
          <td><div className="bar"><span className=${r.cov < .25 ? 'low' : r.cov < .5 ? 'mid' : ''} style=${{width:Math.max(2, r.cov * 100) + '%', animationDelay:(k * 60) + 'ms'}}></span></div></td>
          <td className="mono num" style=${{textAlign:'right', whiteSpace:'nowrap'}}>${r.n} / ${r.target}</td>
          <td><span className=${'tag ' + (r.level === 'High' ? 't-risk' : r.level === 'Medium' ? 't-warn' : 't-ok')}>${r.level}</span></td></tr>`; })}</tbody>
      </table>
    </section>
  </div>`;
}

  var sugs=['Is RC=4 from POSTTRAN a failure?','What does reason 103 mean?','Can I run INTCALC now?'];
  return html`<div className="page ask-page">
    <div className="page-head"><h1>Ask Ada</h1><div className="ada-heading-actions">
      <button className="btn btn-ghost ada-mobile-refs" aria-expanded=${refsOpen} aria-controls="ada-references" onClick=${function(){setRefsOpen(!refsOpen);}}><${Icon} n="book"/>References</button>
      <button className="btn btn-secondary" aria-label="New chat" onClick=${newChat}><${Icon} n="chat"/>New chat</button>
    </div></div>
    <div className="ada-layout">
      <section className="panel ada-chat" aria-label="Chat with Ada">
        <div className="ada-messages" ref=${messages} role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions" onScroll=${function(ev){var el=ev.currentTarget;follow.current=el.scrollHeight-el.scrollTop-el.clientHeight<100;}}>
          ${!thread.length?html`<div className="ada-welcome"><span className="ada-avatar" aria-hidden="true">A</span><h2>What are you working on?</h2><p>Ask about your COBOL code, batch jobs, or a problem you’re trying to solve.</p>
            <div className="ada-prompts">${sugs.map(function(q){return html`<button key=${q} onClick=${function(){ask(q);}}>${q}</button>`;})}</div>
          </div>`:thread.map(function(m){
            var refs=(m.sources||[]).filter(function(id){var it=itemById(s,id);return it&&it.status==='verified';});
            return html`<article key=${m.id} className="ada-turn">
              <div className="ada-user"><span className="sr">You: </span>${m.q}</div>
              <div className="ada-reply"><span className="ada-avatar" aria-hidden="true">A</span><div className="ada-reply-body">
                <div className="ada-reply-heading"><strong>Ada</strong><span>${m.status==='thinking'?'':m.known?'From confirmed knowledge':'No confirmed answer yet'}</span></div>
                ${m.status==='thinking'?html`<p className="ada-thinking">Checking the knowledge library<span className="caret" aria-hidden="true"></span></p>`:html`
                  <p><${Stream} id=${m.id} text=${m.known?m.text:'I don’t have a confirmed answer to that question yet. You can send it to Linda for review.'} onDone=${scrollLatest}/></p>
                  ${refs.length?html`<div className="ada-citations" aria-label="Answer references">${refs.map(function(id,i){return html`<button key=${id} className="ada-citation" aria-label=${'Show reference '+id} aria-pressed=${!!(active&&active.id===m.id&&selected&&selected.id===id)} onClick=${function(){showReference(m.id,id);}}><${Icon} n="book" size=${12}/>${i+1} · ${id}</button>`;})}</div>`:null}
                  ${!m.known?html`<div className="ada-handoff">${m.sent?html`<${Icon} n="check" size=${14}/><span>Added to Linda’s review queue</span>`:html`<button className="btn btn-secondary" aria-label="Send question to Linda" onClick=${function(){ctx.dispatch({type:'markSent',key:key,id:m.id,q:m.q,twin:'Linda C.'});}}><${Icon} n="send"/>Send question to Linda</button>`}</div>`:null}
                `}
              </div></div>
            </article>`;
          })}
        </div>
        <form className="ada-compose" onSubmit=${function(ev){ev.preventDefault();ask(text);}}>
          <div className="ada-input-wrap"><label className="sr" htmlFor="ada-message">Message Ada</label>
            <textarea id="ada-message" ref=${input} rows="2" value=${text} placeholder="Message Ada…" onInput=${function(ev){setText(ev.target.value);ev.target.style.height='auto';ev.target.style.height=Math.min(ev.target.scrollHeight,150)+'px';}} onKeyDown=${function(ev){if(ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing&&!(ev.nativeEvent&&ev.nativeEvent.isComposing)){ev.preventDefault();ask(text);}}}></textarea>
            <div className="ada-input-actions"><span>Enter to send · Shift + Enter for a new line</span><button className="btn btn-primary" type="submit" aria-label="Send message" disabled=${!text.trim()||busy}><${Icon} n="send"/></button></div>
          </div><p className="ada-compose-note">Demo · Answers use the sample knowledge library.</p>
        </form>
      </section>
      <aside id="ada-references" className=${'panel ada-references'+(refsOpen?' is-open':'')} aria-label="References">
        <div className="ada-reference-head"><div><h2>References${active&&sources.length?' · '+sources.length:''}</h2><p>${active?'Sources for this answer':'From the knowledge library'}</p></div><button className="btn btn-ghost ada-close-refs" aria-label="Close references" onClick=${function(){setRefsOpen(false);}}>Close</button></div>
        <div className="ada-reference-scroll">
          <div className="ada-source-list">${sources.map(function(it){return html`<button key=${it.id} className="ada-source" aria-label=${'Select reference '+it.id} aria-pressed=${!!(selected&&selected.id===it.id)} onClick=${function(){setSelection({message:active?active.id:null,source:it.id});}}><div className="ada-source-meta"><span className="mono">${it.id}</span><${Icon} n="check" size=${13}/></div><strong>${it.title}</strong><span>${it.program} · ${it.owner}</span></button>`;})}</div>
          ${!sources.length?html`<p className="ada-reference-empty">${busy?'References will appear here when Ada finds a confirmed answer.':'There are no confirmed sources for this question yet.'}</p>`:null}
          ${selected?html`<section className="ada-source-detail" aria-label="Selected reference"><h3>${selected.title}</h3><p>${selected.body}</p>
            <dl><div><dt>Expert</dt><dd>${selected.owner}</dd></div><div><dt>Version · confirmed</dt><dd>${details.version} · ${details.confirmed}</dd></div>${details.applies?html`<div><dt>Applies when</dt><dd>${details.applies}</dd></div>`:null}${details.notApplies?html`<div><dt>Doesn’t apply when</dt><dd>${details.notApplies}</dd></div>`:null}</dl>
            ${details.stale?html`<p>${details.stale}</p>`:null}
            ${selected.quote?html`<blockquote>${selected.quote}<small>${selected.source}</small></blockquote>`:null}
            <button className="btn btn-secondary" aria-label="Open full reference" onClick=${function(){ctx.dispatch({type:'patch',patch:{drawer:selected.id}});}}><${Icon} n="book"/>Open full reference<${Icon} n="arrow" size=${14}/></button>
          </section>`:sources.length?html`<p className="ada-reference-empty">Select a reference to read the expert’s explanation and code context.</p>`:null}
        </div>
      </aside>
    </div>
  </div>`;
}

/* ---------------- account ---------------- */
function Account(){
  var ctx=useStore(),s=ctx.s,account=s.accounts[s.role];
  var edit=useState(function(){return Object.assign({},account);}),draft=edit[0],setDraft=edit[1];
  var err=useState(''),error=err[0],setError=err[1];
  var offer=ACCOUNT_OFFERS.find(function(item){return item.id===draft.offer;});
  var dirty=JSON.stringify(draft)!==JSON.stringify(account);
  function change(patch){setDraft(function(previous){return Object.assign({},previous,patch);});setError('');}
  function cancel(){setDraft(Object.assign({},account));setError('');}
  function save(ev){
    ev.preventDefault();
    if(!draft.name.trim()){setError('Enter a name for your profile.');return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(draft.email.trim())){setError('Enter a valid email address.');return;}
    var next=Object.assign({},draft,{name:draft.name.trim(),email:draft.email.trim(),title:draft.title.trim(),team:draft.team.trim()});
    ctx.dispatch({type:'accountSave',role:s.role,account:next});setDraft(next);
    ctx.dispatch({type:'toast',text:'Account information saved for this preview.'});
  }
  return html`<div className="page enter account-page">
    <div className="page-head"><div><h1>Account information</h1><p>Your profile, sign-in details, and selected offer.</p></div></div>
    <div className="account-identity"><span className="av">${accountInitials(account.name)}</span><div><h2>${account.name}</h2><p>${s.role==='expert'?'Expert contributor':'Engineer'} · ${account.team}</p></div><span className="tag t-plain">Demo account</span></div>
    <form onSubmit=${save} aria-label="Account information">
      <div className="account-grid">
        <section className="panel account-panel" aria-labelledby="account-profile-title">
          <h2 id="account-profile-title">Profile</h2>
          <label className="account-field" htmlFor="account-name">Full name<input className="field" id="account-name" value=${draft.name} onInput=${function(ev){change({name:ev.target.value});}} required maxLength="80" autoComplete="off"/></label>
          <label className="account-field" htmlFor="account-title">Job title<input className="field" id="account-title" value=${draft.title} onInput=${function(ev){change({title:ev.target.value});}} maxLength="100"/></label>
          <label className="account-field" htmlFor="account-team">Team or organization<input className="field" id="account-team" value=${draft.team} onInput=${function(ev){change({team:ev.target.value});}} maxLength="100"/></label>
        </section>
        <section className="panel account-panel" aria-labelledby="account-signin-title">
          <h2 id="account-signin-title">Sign-in details</h2>
          <label className="account-field" htmlFor="account-email">Email address<input className="field" id="account-email" type="email" value=${draft.email} onInput=${function(ev){change({email:ev.target.value});}} required autoComplete="off"/></label>
          <dl className="account-details"><div><dt>Sign-in method</dt><dd>Email</dd></div><div><dt>Password</dt><dd>Not set in this demo</dd></div><div><dt>Account type</dt><dd>${s.role==='expert'?'Expert':'Engineer'}</dd></div></dl>
          <p>This preview does not create or change real login credentials.</p>
        </section>
        <section className="panel account-panel" aria-labelledby="account-offer-title">
          <h2 id="account-offer-title">Selected offer</h2>
          <label className="account-field" htmlFor="account-offer">Bank offer<select className="field" id="account-offer" value=${draft.offer} onChange=${function(ev){change({offer:ev.target.value});}}><option value="">No offer selected</option>${ACCOUNT_OFFERS.map(function(item){return html`<option key=${item.id} value=${item.id}>${item.bank} · ${item.title}</option>`;})}</select></label>
          ${offer?html`<div className="account-offer"><span>${offer.bank}</span><strong>${offer.value}</strong><span>${offer.title}</span><p>${offer.detail}</p></div>`:html`<div className="account-offer-empty">Choose an offer above to add it to your profile.</div>`}
          <p>Sample offers for this prototype.</p>
          <a href="../index.html#/offers" target="_blank" rel="noopener" style=${{fontSize:13,alignSelf:'flex-start'}}>Explore bank offers ↗</a>
        </section>
        <section className="panel account-panel" aria-labelledby="account-preferences-title">
          <h2 id="account-preferences-title">Preferences</h2>
          <label className="account-field" htmlFor="account-timezone">Time zone<select className="field" id="account-timezone" value=${draft.timezone} onChange=${function(ev){change({timezone:ev.target.value});}}><option value="America/Los_Angeles">Pacific Time — Los Angeles</option><option value="America/New_York">Eastern Time — New York</option><option value="Europe/London">London</option><option value="Asia/Shanghai">China Standard Time — Shanghai</option><option value="UTC">UTC</option></select></label>
          <label className="account-preference" htmlFor="account-reminders"><input id="account-reminders" type="checkbox" checked=${draft.reminders} onChange=${function(ev){change({reminders:ev.target.checked});}}/><span>Review reminders<small>Updates about drafts waiting for review.</small></span></label>
          <label className="account-preference" htmlFor="account-questions"><input id="account-questions" type="checkbox" checked=${draft.questions} onChange=${function(ev){change({questions:ev.target.checked});}}/><span>Question updates<small>Updates when a question or answer is added.</small></span></label>
        </section>
      </div>
      ${error?html`<p className="account-error" role="alert">${error}</p>`:null}
      <div className="account-actions"><button type="submit" className="btn btn-primary btn-lg" disabled=${!dirty}>Save changes</button><button type="button" className="btn btn-secondary btn-lg" onClick=${cancel} disabled=${!dirty}>Cancel</button><span>Changes stay in this preview until you refresh.</span></div>
    </form>
  </div>`;
}

/* ---------------- app ---------------- */
function workspaceEntryState(base){
  var match = /^#\/(expert|engineer)\/([a-z-]+)$/.exec(window.location.hash);
  if (!match) return base;
  var role = match[1], route = match[2];
  var allowed = route === 'account' || (role === 'expert' && route === 'inbox') || NAV[role].some(function(page){return page.id === route;});
  return allowed ? Object.assign({}, base, {role:role, route:route}) : base;
}
function App(){
  var r = useReducer(reducer, initState, workspaceEntryState), s = r[0], dispatch = r[1];
  var contentRef = useRef(null);
  function go(route){ transition(function(){ dispatch({type:'route', route:route}); }); if (contentRef.current) contentRef.current.scrollTop = 0; }
  useEffect(function(){
    function key(ev){
      if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); dispatch({type:'patch', patch:{palette:!s.palette}}); }
      else if (ev.key === 'Escape') { if (s.palette) dispatch({type:'patch', patch:{palette:false}}); else if (s.drawer) dispatch({type:'patch', patch:{drawer:null}}); }
    }
    window.addEventListener('keydown', key); return function(){ window.removeEventListener('keydown', key); };
  }, [s.palette, s.drawer]);
  useEffect(function(){ if (s.fresh.length) { var t = setTimeout(function(){ dispatch({type:'patch', patch:{fresh:[]}}); }, 9000); return function(){ clearTimeout(t); }; } }, [s.fresh]);
  var Page = {home:Home, session:Interview, review:Review, inbox:Inbox, library:Library, coverage:Coverage, leaderboard:Leaderboard, tickets:Tickets, ask:Ask, account:Account}[s.route] || Home;
  return html`<${Store.Provider} value=${{s:s, dispatch:dispatch, go:go}}>
    <div className="shell">
      <${Sidebar}/>
      <div className="main"><${Topbar}/><main className="content" ref=${contentRef}><${Page} key=${s.role + s.route}/></main></div>
    </div>
    ${s.drawer ? html`<${Drawer}/>` : null}
    ${s.palette ? html`<${Palette}/>` : null}
    <${Toasts}/>
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>
</body>
</html>
